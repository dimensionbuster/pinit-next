[package]
name = "pinit-next"
version = "0.2.2"
description = "PinIt: always-on-top image windows"
authors = ["PinIt"]
edition = "2024"

[lib]
# The `_lib` suffix is required on Windows to avoid a bin/lib name clash.
name = "pinit_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pinit-core = { path = "../crates/pinit-core" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
