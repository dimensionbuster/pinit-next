[package]
name = "pinit-next"
version = "0.2.2"
description = "PinIt: always-on-top image windows"
authors = ["PinIt"]
edition = "2024"

[lib]
# The `_lib` suffix is required on Windows to avoid a bin/lib name clash.
name = "pinit_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pinit-core = { path = "../crates/pinit-core" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

# Named pipe for the live-video bridge (no network port): see src/pipe.rs.
# webview2-com + windows: native anchoring of the WebView2 surface, see src/anchor.rs
# (versions match what tauri already resolves).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
] }
